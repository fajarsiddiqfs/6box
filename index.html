<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>MyDash</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  color: #fff;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#app {
  width: 100vw;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1px 1fr;
  grid-template-rows: 1fr;
}

.divider {
  background: rgba(255,255,255,0.12);
  height: 100%;
}

/* ═══════════════════
   LEFT — CLOCK + WEATHER
═══════════════════ */
#left {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 5vh 5vw;
  height: 100vh;
}

/* TIME */
#time {
  font-size: clamp(5rem, 18vw, 16rem);
  font-weight: 900;
  letter-spacing: -4px;
  line-height: 0.9;
  color: #fff;
}

/* DAY */
#day {
  font-size: clamp(1.4rem, 3.5vw, 3.5rem);
  font-weight: 700;
  color: rgba(255,255,255,0.45);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-top: 2vh;
}

/* DATE */
#date {
  font-size: clamp(1.6rem, 4vw, 4rem);
  font-weight: 800;
  color: #fff;
  margin-top: 0.5vh;
  line-height: 1.1;
}

/* WEATHER BLOCK */
#weather-block {
  display: flex;
  flex-direction: column;
  gap: 1.2vh;
  border-top: 1px solid rgba(255,255,255,0.12);
  padding-top: 3vh;
}

#loc-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: clamp(0.9rem, 1.8vw, 1.6rem);
  font-weight: 600;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  letter-spacing: 2px;
}
#loc-row svg { width: 1.3em; height: 1.3em; flex-shrink: 0; }

#temp-line {
  display: flex;
  align-items: flex-end;
  gap: 3vw;
}

#temp {
  font-size: clamp(3.5rem, 10vw, 9rem);
  font-weight: 900;
  letter-spacing: -3px;
  line-height: 1;
  color: #fff;
}

#wx-right {
  display: flex;
  flex-direction: column;
  gap: 0.6vh;
  padding-bottom: 0.8vh;
}

#wx-desc {
  font-size: clamp(1.2rem, 2.8vw, 2.5rem);
  font-weight: 800;
  color: #fff;
  line-height: 1.1;
}

.wx-stat {
  font-size: clamp(0.85rem, 1.6vw, 1.4rem);
  font-weight: 600;
  color: rgba(255,255,255,0.4);
}
.wx-stat b { color: rgba(255,255,255,0.8); font-weight: 700; }


/* ═══════════════════
   RIGHT — RADIO
═══════════════════ */
#right {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 5vh 5vw;
  height: 100vh;
}

#radio-label {
  font-size: clamp(0.75rem, 1.5vw, 1.2rem);
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  display: flex;
  align-items: center;
  gap: 10px;
}
.live-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #fff;
  animation: blink 1.8s ease infinite;
  flex-shrink: 0;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* Now playing */
#now-playing {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.5vh;
}

#station-name {
  font-size: clamp(2.4rem, 7vw, 6.5rem);
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1.0;
  color: #fff;
}

#station-tag {
  font-size: clamp(1rem, 2.2vw, 2rem);
  font-weight: 700;
  color: rgba(255,255,255,0.4);
  letter-spacing: 1px;
}

#stream-status {
  font-size: clamp(0.85rem, 1.6vw, 1.4rem);
  font-weight: 600;
  color: rgba(255,255,255,0.3);
  letter-spacing: 1px;
  min-height: 1.5em;
  transition: color 0.4s;
}
#stream-status.on { color: rgba(255,255,255,0.65); }

/* Station switch buttons */
#station-btns {
  display: flex;
  gap: 2vw;
  margin-bottom: 2vh;
}

.st-btn {
  flex: 1;
  padding: 2.2vh 0;
  border-radius: 18px;
  border: 2px solid rgba(255,255,255,0.15);
  background: transparent;
  color: rgba(255,255,255,0.5);
  font-family: 'Inter', sans-serif;
  font-size: clamp(0.9rem, 1.8vw, 1.6rem);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1.2;
  text-align: center;
}
.st-btn:hover { border-color: rgba(255,255,255,0.4); color: #fff; }
.st-btn.active {
  background: #fff;
  border-color: #fff;
  color: #000;
}

/* Play controls */
#controls {
  display: flex;
  flex-direction: column;
  gap: 2.5vh;
  border-top: 1px solid rgba(255,255,255,0.12);
  padding-top: 3vh;
}

#play-row {
  display: flex;
  align-items: center;
  gap: 2vw;
}

#play-btn {
  width: clamp(68px, 10vw, 100px);
  height: clamp(68px, 10vw, 100px);
  border-radius: 50%;
  border: none;
  background: #fff;
  color: #000;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
}
#play-btn:hover { background: rgba(255,255,255,0.88); }
#play-btn:active { transform: scale(0.95); }
#play-btn svg { width: 38%; height: 38%; }

#play-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
#play-info-title {
  font-size: clamp(1rem, 2vw, 1.8rem);
  font-weight: 800;
  color: #fff;
}
#play-info-sub {
  font-size: clamp(0.75rem, 1.3vw, 1.1rem);
  font-weight: 600;
  color: rgba(255,255,255,0.35);
}

/* Volume */
#vol-row {
  display: flex;
  align-items: center;
  gap: 16px;
}
#vol-row svg { width: clamp(18px,2.5vw,28px); height: clamp(18px,2.5vw,28px); color: rgba(255,255,255,0.35); flex-shrink: 0; }
#vol-slider {
  flex: 1;
  -webkit-appearance: none;
  height: 5px;
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  cursor: pointer;
  outline: none;
}
#vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: clamp(22px, 3vw, 32px);
  height: clamp(22px, 3vw, 32px);
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
#vol-label {
  font-size: clamp(0.8rem, 1.3vw, 1.1rem);
  font-weight: 700;
  color: rgba(255,255,255,0.4);
  min-width: 3ch;
  text-align: right;
}

/* Fullscreen btn */
#fs-btn {
  position: fixed;
  bottom: 18px; right: 20px;
  width: clamp(42px, 5vw, 54px);
  height: clamp(42px, 5vw, 54px);
  border-radius: 14px;
  border: 2px solid rgba(255,255,255,0.18);
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(10px);
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 999;
  transition: border-color 0.2s;
}
#fs-btn:hover { border-color: rgba(255,255,255,0.5); }
#fs-btn svg { width: 45%; height: 45%; }
</style>
</head>
<body>
<div id="app">

  <!-- LEFT: Clock + Weather -->
  <div id="left">
    <div>
      <div id="time">00:00</div>
      <div id="day">—</div>
      <div id="date">—</div>
    </div>

    <div id="weather-block">
      <div id="loc-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="loc-text">Locating...</span>
      </div>
      <div id="temp-line">
        <div id="temp">—°</div>
        <div id="wx-right">
          <div id="wx-desc">—</div>
          <div class="wx-stat">Humidity <b id="w-hum">—</b></div>
          <div class="wx-stat">Wind <b id="w-wind">—</b></div>
        </div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- RIGHT: Radio -->
  <div id="right">
    <div id="radio-label">
      <span class="live-dot"></span> Live Radio
    </div>

    <div id="now-playing">
      <div id="station-name">Quran Radio</div>
      <div id="station-tag">Tarateel Quran · Live</div>
      <div id="stream-status">Tap play to begin</div>
    </div>

    <div id="station-btns">
      <button class="st-btn active" id="btn-0" onclick="switchStation(0)">
        Quran<br>Radio
      </button>
      <button class="st-btn" id="btn-1" onclick="switchStation(1)">
        SomaFM<br>Drone Zone
      </button>
    </div>

    <div id="controls">
      <div id="play-row">
        <button id="play-btn" onclick="togglePlay()">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        </button>
        <div id="play-info">
          <div id="play-info-title">Play</div>
          <div id="play-info-sub">Select station above</div>
        </div>
      </div>
      <div id="vol-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>
        <input type="range" id="vol-slider" min="0" max="100" value="85" oninput="setVol(this.value)">
        <div id="vol-label">85</div>
      </div>
    </div>
  </div>

</div>

<button id="fs-btn" onclick="toggleFS()">
  <svg id="fs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
    <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
  </svg>
</button>

<audio id="aud" preload="none"></audio>

<script>
// ══════════════════════
//  CLOCK
// ══════════════════════
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function tick() {
  const n  = new Date();
  const hh = String(n.getHours()).padStart(2,'0');
  const mm = String(n.getMinutes()).padStart(2,'0');
  document.getElementById('time').textContent = hh + ':' + mm;
  document.getElementById('day').textContent  = DAYS[n.getDay()].toUpperCase();
  document.getElementById('date').textContent = n.getDate() + ' ' + MONTHS[n.getMonth()] + ' ' + n.getFullYear();
}
tick();
setInterval(tick, 1000);

// ══════════════════════
//  WEATHER
// ══════════════════════
const WX = {0:'Clear Sky',1:'Mostly Clear',2:'Partly Cloudy',3:'Overcast',45:'Foggy',48:'Icy Fog',51:'Light Drizzle',53:'Drizzle',55:'Heavy Drizzle',61:'Light Rain',63:'Raining',65:'Heavy Rain',71:'Light Snow',73:'Snowing',75:'Heavy Snow',80:'Rain Showers',81:'Heavy Showers',82:'Storm Showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};

async function getWeather(lat, lon) {
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=kmh&timezone=auto');
    const d = await r.json();
    const c = d.current;
    document.getElementById('temp').textContent    = Math.round(c.temperature_2m) + '°';
    document.getElementById('wx-desc').textContent = WX[c.weather_code] || 'Unknown';
    document.getElementById('w-hum').textContent   = c.relative_humidity_2m + '%';
    document.getElementById('w-wind').textContent  = Math.round(c.wind_speed_10m) + ' km/h';
  } catch(e) {
    document.getElementById('wx-desc').textContent = 'Unavailable';
  }
}

async function getLocName(lat, lon) {
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json');
    const d = await r.json();
    const a = d.address;
    const name  = a.suburb || a.village || a.town || a.city || a.county || '';
    const state = a.state || '';
    document.getElementById('loc-text').textContent = [name, state].filter(Boolean).join(', ');
  } catch(e) {}
}

function initGeo() {
  if (!navigator.geolocation) {
    document.getElementById('loc-text').textContent = 'Selangor, MY';
    getWeather(2.9980, 101.5850);
    return;
  }
  navigator.geolocation.getCurrentPosition(function(pos) {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    getLocName(lat, lon);
    getWeather(lat, lon);
    setInterval(function(){ getWeather(lat, lon); }, 5 * 60 * 1000);
  }, function() {
    document.getElementById('loc-text').textContent = 'Putra Heights, Selangor';
    getWeather(2.9980, 101.5850);
  }, { timeout: 10000, enableHighAccuracy: true });
}

// ══════════════════════
//  RADIO
// ══════════════════════
const STATIONS = [
  {
    name: 'Quran Radio',
    tag:  'Tarateel Quran · Live',
    url:  'https://qurango.net/radio/tarateel'
  },
  {
    name: 'SomaFM',
    tag:  'Drone Zone · Ambient',
    url:  'https://ice1.somafm.com/dronezone-128-mp3'
  }
];

let stIdx     = 0;
let isPlaying = false;
const aud     = document.getElementById('aud');

function setStatus(txt, on) {
  const el = document.getElementById('stream-status');
  el.textContent = txt;
  el.className   = on ? 'on' : '';
}

function updateNowPlaying() {
  const s = STATIONS[stIdx];
  document.getElementById('station-name').textContent  = s.name;
  document.getElementById('station-tag').textContent   = s.tag;
  document.getElementById('play-info-title').textContent = s.name;
  document.getElementById('play-info-sub').textContent   = s.tag;
  document.querySelectorAll('.st-btn').forEach(function(b, i) {
    b.classList.toggle('active', i === stIdx);
  });
}

function switchStation(i) {
  stIdx = i;
  updateNowPlaying();
  setStatus('Tap play to begin', false);
  if (isPlaying) {
    aud.pause();
    startStream();
  }
}

function startStream() {
  setStatus('Connecting...', false);
  aud.src    = STATIONS[stIdx].url;
  aud.volume = document.getElementById('vol-slider').value / 100;
  aud.load();
  aud.play().catch(function() {
    setStatus('Could not connect — check network', false);
    isPlaying = false;
    setPlayIcon(false);
  });
}

function setPlayIcon(playing) {
  document.getElementById('play-icon').innerHTML = playing
    ? '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'
    : '<polygon points="6 3 20 12 6 21 6 3"/>';
}

function togglePlay() {
  if (!isPlaying) {
    isPlaying = true;
    setPlayIcon(true);
    startStream();
  } else {
    isPlaying = false;
    aud.pause();
    setPlayIcon(false);
    setStatus('Paused', false);
  }
}

function setVol(v) {
  aud.volume = v / 100;
  document.getElementById('vol-label').textContent = v;
}

aud.addEventListener('playing', function() { setStatus('Playing Live', true); });
aud.addEventListener('waiting', function() { setStatus('Buffering...', false); });
aud.addEventListener('stalled', function() { setStatus('Stream stalled — retrying...', false); });
aud.addEventListener('error',   function() {
  setStatus('Stream error — check connection', false);
  isPlaying = false;
  setPlayIcon(false);
});

// Auto-retry on stall
let retryTimer = null;
aud.addEventListener('stalled', function() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(function() {
    if (isPlaying) startStream();
  }, 4000);
});

// ══════════════════════
//  FULLSCREEN
// ══════════════════════
const FS_EXPAND = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
const FS_SHRINK = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';

function toggleFS() {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
    document.getElementById('fs-icon').innerHTML = FS_SHRINK;
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    document.getElementById('fs-icon').innerHTML = FS_EXPAND;
  }
}
document.addEventListener('fullscreenchange', function() {
  if (!document.fullscreenElement)
    document.getElementById('fs-icon').innerHTML = FS_EXPAND;
});

// ══════════════════════
//  INIT
// ══════════════════════
initGeo();
updateNowPlaying();
</script>
</body>
</html>
