<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CarPlayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0b0b0b;
  --s1:#141414;
  --s2:#1c1c1c;
  --s3:#242424;
  --bdr:#2e2e2e;
  --w:#ffffff;
  --w70:rgba(255,255,255,.7);
  --w40:rgba(255,255,255,.4);
  --w15:rgba(255,255,255,.15);
  --w08:rgba(255,255,255,.08);
  --w04:rgba(255,255,255,.04);
  --font:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
}

html,body{
  width:100%;height:100%;
  background:var(--bg);
  color:var(--w);
  font-family:var(--font);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* ══════════════════════════════
   ROOT LAYOUT  —  3 columns
   Left: clock+weather  |  Mid: radio  |  Right: nav
   ══════════════════════════════ */
#app{
  display:grid;
  grid-template-columns:1fr 1fr 1.6fr;
  grid-template-rows:100vh;
  gap:10px;
  padding:10px;
  height:100vh;
}

.card{
  background:var(--s1);
  border-radius:22px;
  border:1px solid var(--bdr);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ══════════════════════════════
   COLUMN 1 — CLOCK + WEATHER
   ══════════════════════════════ */
#col-left{
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* Clock card */
#clock-card{
  padding:28px 26px 22px;
  flex-shrink:0;
  justify-content:center;
}

#time{
  font-family:var(--mono);
  font-size:72px;
  font-weight:500;
  letter-spacing:-2px;
  line-height:1;
  color:var(--w);
}

#time-sub{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:6px;
}

#ampm{
  font-size:18px;
  font-weight:500;
  color:var(--w40);
}

#dateline{
  font-size:15px;
  font-weight:400;
  color:var(--w40);
}

/* Speed badge */
#spd-badge{
  display:inline-flex;
  align-items:baseline;
  gap:4px;
  background:var(--w08);
  border:1px solid var(--bdr);
  border-radius:10px;
  padding:5px 12px;
  margin-top:14px;
}
#spd-num{font-family:var(--mono);font-size:28px;font-weight:500;color:var(--w);}
#spd-unit{font-size:12px;color:var(--w40);letter-spacing:1px;}

/* Weather card */
#wx-card{
  flex:1;
  padding:24px 26px 20px;
}

#wx-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-bottom:20px;
}

#wx-icon{font-size:52px;line-height:1;}

#wx-right{text-align:right;}
#wx-temp{
  font-family:var(--mono);
  font-size:52px;
  font-weight:500;
  line-height:1;
  color:var(--w);
  letter-spacing:-1px;
}
#wx-cond{
  font-size:14px;
  color:var(--w40);
  margin-top:4px;
  text-transform:uppercase;
  letter-spacing:1px;
}

#wx-divider{height:1px;background:var(--bdr);margin:0 0 18px;}

#wx-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.wx-stat{
  background:var(--w04);
  border-radius:12px;
  padding:12px 14px;
}
.wx-stat-lbl{font-size:11px;color:var(--w40);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.wx-stat-val{font-size:20px;font-weight:600;color:var(--w);}

#wx-loc{
  margin-top:16px;
  font-size:12px;
  color:var(--w40);
  letter-spacing:1px;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:7px;
}
.loc-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--w);opacity:.35;
  animation:pulse 2.5s infinite;
  flex-shrink:0;
}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.1}}

/* ══════════════════════════════
   COLUMN 2 — RADIO
   ══════════════════════════════ */
#radio-card{
  padding:0;
}

#r-header{
  padding:24px 24px 18px;
  border-bottom:1px solid var(--bdr);
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
}

#r-label{
  font-size:12px;
  font-weight:600;
  letter-spacing:2px;
  color:var(--w40);
  text-transform:uppercase;
}

#eq-wrap{
  display:flex;
  align-items:flex-end;
  gap:3px;
  height:18px;
  opacity:0;
  transition:opacity .3s;
}
#eq-wrap.on{opacity:1;}
.eq{width:4px;background:var(--w);border-radius:2px;}
.eq:nth-child(1){height:7px; animation:eqa .65s 0s   infinite alternate ease-in-out;}
.eq:nth-child(2){height:16px;animation:eqa .65s .1s  infinite alternate ease-in-out;}
.eq:nth-child(3){height:10px;animation:eqa .65s .2s  infinite alternate ease-in-out;}
.eq:nth-child(4){height:16px;animation:eqa .65s .05s infinite alternate ease-in-out;}
.eq:nth-child(5){height:6px; animation:eqa .65s .15s infinite alternate ease-in-out;}
@keyframes eqa{from{transform:scaleY(.15)}to{transform:scaleY(1)}}

#stations{
  flex:1;
  overflow-y:auto;
  padding:12px;
  scrollbar-width:none;
  display:flex;
  flex-direction:column;
  gap:8px;
}
#stations::-webkit-scrollbar{display:none;}

.stn{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 16px;
  border-radius:16px;
  cursor:pointer;
  border:1.5px solid transparent;
  background:var(--w04);
  transition:background .15s,border-color .15s;
  flex-shrink:0;
}
.stn:active{opacity:.7;}
.stn.active{
  background:var(--w08);
  border-color:var(--w15);
}

.stn-logo{
  width:54px;height:54px;
  border-radius:12px;
  background:var(--s3);
  border:1.5px solid var(--bdr);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
  color:var(--w70);
  flex-shrink:0;
  letter-spacing:.5px;
}
.stn.active .stn-logo{background:var(--w);color:#000;border-color:var(--w);}

.stn-info{flex:1;min-width:0;}
.stn-name{font-size:17px;font-weight:600;color:var(--w70);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stn.active .stn-name{color:var(--w);}
.stn-genre{font-size:12px;color:var(--w40);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}

.stn-spinner{
  display:none;
  width:32px;height:32px;
  border:2px solid var(--bdr);
  border-top-color:var(--w40);
  border-radius:50%;
  animation:spin .7s linear infinite;
  flex-shrink:0;
}
.stn.loading .stn-spinner{display:block;}
.stn.loading .stn-play{display:none;}
@keyframes spin{to{transform:rotate(360deg)}}

.stn-play{
  width:44px;height:44px;
  border-radius:50%;
  border:1.5px solid var(--bdr);
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;padding:0;
  transition:background .15s,border-color .15s;
}
.stn.active .stn-play{background:var(--w);border-color:var(--w);}
.stn-play svg{width:16px;height:16px;}
.play-ico{fill:var(--w40);}
.stn.active .stn-play .play-ico{fill:#000;}

#np-bar{
  padding:16px 20px 18px;
  border-top:1px solid var(--bdr);
  flex-shrink:0;
}
#np-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
#np-lbl{font-size:11px;color:var(--w40);letter-spacing:2px;text-transform:uppercase;}
#np-name{font-size:17px;font-weight:600;color:var(--w70);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;margin:0 14px;}
#vol-row{display:flex;align-items:center;gap:10px;}
#vol-row svg{width:16px;height:16px;fill:var(--w40);flex-shrink:0;}
#vol{
  flex:1;-webkit-appearance:none;
  height:3px;border-radius:2px;background:var(--s3);outline:none;cursor:pointer;
}
#vol::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:18px;height:18px;border-radius:50%;background:var(--w);cursor:pointer;
}

/* ══════════════════════════════
   COLUMN 3 — NAVIGATION
   ══════════════════════════════ */
#nav-card{padding:0;}

#nav-header{
  padding:22px 22px 16px;
  border-bottom:1px solid var(--bdr);
  flex-shrink:0;
}

#nav-header-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}

#nav-title{font-size:12px;font-weight:600;letter-spacing:2px;color:var(--w40);text-transform:uppercase;}

/* App launch buttons */
#app-btns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}

.app-launch{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:16px 10px;
  background:var(--w04);
  border:1.5px solid var(--bdr);
  border-radius:14px;
  cursor:pointer;
  transition:background .15s,border-color .15s;
  text-decoration:none;
  color:inherit;
}
.app-launch:active{opacity:.7;}
.app-launch:hover{background:var(--w08);border-color:var(--w15);}
.app-launch-icon{font-size:28px;line-height:1;}
.app-launch-name{font-size:14px;font-weight:600;color:var(--w70);}
.app-launch-sub{font-size:11px;color:var(--w40);text-align:center;}

/* Search */
#search-row{
  display:flex;gap:8px;
}
#dest{
  flex:1;
  padding:13px 16px;
  background:var(--w08);
  border:1.5px solid var(--bdr);
  border-radius:12px;
  color:var(--w);
  font-family:var(--font);
  font-size:15px;
  outline:none;
}
#dest::placeholder{color:var(--w40);}
#dest:focus{border-color:var(--w15);}
#go-btn{
  padding:13px 18px;
  background:var(--w);
  border:none;
  border-radius:12px;
  color:#000;
  font-family:var(--font);
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  flex-shrink:0;
  transition:opacity .15s;
}
#go-btn:active{opacity:.7;}

/* Places grid */
#places-section{
  flex:1;
  overflow-y:auto;
  padding:10px 14px 14px;
  scrollbar-width:none;
}
#places-section::-webkit-scrollbar{display:none;}

#places-label{
  font-size:11px;
  font-weight:600;
  letter-spacing:2px;
  color:var(--w40);
  text-transform:uppercase;
  padding:4px 6px 10px;
}

#places-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.place-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  padding:18px 8px 14px;
  background:var(--w04);
  border:1.5px solid var(--bdr);
  border-radius:16px;
  cursor:pointer;
  transition:background .15s,border-color .15s;
  text-decoration:none;
  color:inherit;
  -webkit-tap-highlight-color:transparent;
  position:relative;
  overflow:hidden;
}
.place-btn:active{opacity:.65;}
.place-btn:hover{background:var(--w08);border-color:var(--w15);}

.place-icon{font-size:30px;line-height:1;}
.place-name{
  font-size:13px;
  font-weight:600;
  color:var(--w70);
  text-align:center;
  line-height:1.3;
}

/* Sub-action row per place */
.place-actions{
  display:flex;gap:5px;width:100%;margin-top:2px;
}
.pa-btn{
  flex:1;
  padding:6px 0;
  background:var(--w08);
  border:1px solid var(--bdr);
  border-radius:8px;
  color:var(--w40);
  font-family:var(--font);
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  transition:background .12s,color .12s;
  letter-spacing:.3px;
}
.pa-btn:active{opacity:.6;}
.pa-btn:hover{background:var(--w15);color:var(--w);}

#audio-el{display:none;}
</style>
</head>
<body>
<div id="app">

  <!-- ── COL 1: CLOCK + WEATHER ── -->
  <div id="col-left">

    <div class="card" id="clock-card">
      <div id="time">00:00</div>
      <div id="time-sub">
        <div id="ampm">AM</div>
        <div id="dateline">—</div>
      </div>
      <div id="spd-badge">
        <span id="spd-num">0</span>
        <span id="spd-unit">km/h</span>
      </div>
    </div>

    <div class="card" id="wx-card">
      <div id="wx-top">
        <div id="wx-icon">⛅</div>
        <div id="wx-right">
          <div id="wx-temp">—°</div>
          <div id="wx-cond">Loading</div>
        </div>
      </div>
      <div id="wx-divider"></div>
      <div id="wx-grid">
        <div class="wx-stat"><div class="wx-stat-lbl">Humidity</div><div class="wx-stat-val" id="wx-hum">--%</div></div>
        <div class="wx-stat"><div class="wx-stat-lbl">Wind</div><div class="wx-stat-val" id="wx-wind">--</div></div>
        <div class="wx-stat"><div class="wx-stat-lbl">Feels Like</div><div class="wx-stat-val" id="wx-feel">--°</div></div>
        <div class="wx-stat"><div class="wx-stat-lbl">UV Index</div><div class="wx-stat-val" id="wx-uv">--</div></div>
      </div>
      <div id="wx-loc"><div class="loc-dot"></div>Putra Heights, Selangor</div>
    </div>

  </div>

  <!-- ── COL 2: RADIO ── -->
  <div class="card" id="radio-card">
    <div id="r-header">
      <div id="r-label">Radio</div>
      <div id="eq-wrap">
        <div class="eq"></div><div class="eq"></div><div class="eq"></div>
        <div class="eq"></div><div class="eq"></div>
      </div>
    </div>

    <div id="stations"></div>

    <div id="np-bar">
      <div id="np-top">
        <div id="np-lbl">Playing</div>
        <div id="np-name">Select a station</div>
      </div>
      <div id="vol-row">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8">
      </div>
    </div>
  </div>

  <!-- ── COL 3: NAVIGATION ── -->
  <div class="card" id="nav-card">
    <div id="nav-header">
      <div id="nav-header-top">
        <div id="nav-title">Navigation</div>
      </div>
      <div id="app-btns">
        <a class="app-launch" id="waze-btn" href="#">
          <div class="app-launch-icon">🗺</div>
          <div class="app-launch-name">Waze</div>
          <div class="app-launch-sub">Traffic alerts</div>
        </a>
        <a class="app-launch" id="gmaps-btn" href="#">
          <div class="app-launch-icon">📍</div>
          <div class="app-launch-name">Google Maps</div>
          <div class="app-launch-sub">Directions</div>
        </a>
      </div>
      <div id="search-row">
        <input type="text" id="dest" placeholder="Type a destination…">
        <button id="go-btn">GO</button>
      </div>
    </div>

    <div id="places-section">
      <div id="places-label">Near Me</div>
      <div id="places-grid"></div>
    </div>
  </div>

</div>
<audio id="audio-el" preload="none"></audio>

<script>
// ── STATIONS (3 great driving stations) ──
const STATIONS=[
  {
    name:"Hitz FM",
    genre:"Pop · Top 40",
    abbr:"HZ",
    url:"https://stream.zeno.fm/7yw0sjy1y0zuv"
  },
  {
    name:"Fly FM",
    genre:"R&B · Pop Hits",
    abbr:"FLY",
    url:"https://stream.zeno.fm/sbcv00q7rcvuv"
  },
  {
    name:"ERA FM",
    genre:"Malay · Hits",
    abbr:"ERA",
    url:"https://stream.zeno.fm/54ydnx2d0nfuv"
  }
];

const audio=document.getElementById('audio-el');
const eqWrap=document.getElementById('eq-wrap');
const npName=document.getElementById('np-name');
const volEl=document.getElementById('vol');
let cur=-1,playing=false;

function buildStations(){
  const wrap=document.getElementById('stations');
  STATIONS.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='stn';
    el.innerHTML=`
      <div class="stn-logo">${s.abbr}</div>
      <div class="stn-info">
        <div class="stn-name">${s.name}</div>
        <div class="stn-genre">${s.genre}</div>
      </div>
      <div class="stn-spinner"></div>
      <button class="stn-play" aria-label="Play ${s.name}">
        <svg viewBox="0 0 24 24"><path class="play-ico" d="M8 5v14l11-7z"/></svg>
      </button>`;
    el.addEventListener('click',()=>toggle(i));
    wrap.appendChild(el);
  });
}

function toggle(i){
  const all=document.querySelectorAll('.stn');
  if(cur===i&&playing){
    audio.pause();playing=false;
    all[i].classList.remove('active');
    eqWrap.classList.remove('on');
    npName.textContent='Paused';
    setIcon(i,false);return;
  }
  if(cur!==-1){all[cur].classList.remove('active','loading');setIcon(cur,false);}
  cur=i;
  all[i].classList.add('loading');
  npName.textContent='Connecting…';
  audio.src=STATIONS[i].url;
  audio.volume=+volEl.value;
  audio.play().then(()=>{
    all[i].classList.remove('loading');
    all[i].classList.add('active');
    playing=true;eqWrap.classList.add('on');
    npName.textContent=STATIONS[i].name+' — '+STATIONS[i].genre;
    setIcon(i,true);
  }).catch(()=>{
    all[i].classList.remove('loading');
    npName.textContent='Stream unavailable';
    cur=-1;
  });
}

function setIcon(i,p){
  const btn=document.querySelectorAll('.stn')[i].querySelector('.stn-play');
  btn.innerHTML=p
    ?`<svg viewBox="0 0 24 24"><path class="play-ico" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`
    :`<svg viewBox="0 0 24 24"><path class="play-ico" d="M8 5v14l11-7z"/></svg>`;
}

volEl.addEventListener('input',()=>{audio.volume=+volEl.value;});

// ── CLOCK ──
function tick(){
  const n=new Date();
  let h=n.getHours(),m=String(n.getMinutes()).padStart(2,'0');
  const ap=h>=12?'PM':'AM';h=h%12||12;
  document.getElementById('time').textContent=h+':'+m;
  document.getElementById('ampm').textContent=ap;
  const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('dateline').textContent=D[n.getDay()]+', '+n.getDate()+' '+M[n.getMonth()]+' '+n.getFullYear();
}
setInterval(tick,1000);tick();

// ── WEATHER ──
const WI={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',53:'🌦',55:'🌧',61:'🌧',63:'🌧',65:'🌧',80:'🌦',81:'🌧',82:'⛈',95:'⛈',99:'⛈'};
const WD={0:'Clear',1:'Mainly Clear',2:'Partly Cloudy',3:'Overcast',45:'Foggy',51:'Light Drizzle',53:'Drizzle',55:'Heavy Drizzle',61:'Light Rain',63:'Rain',65:'Heavy Rain',80:'Showers',81:'Heavy Showers',82:'Violent Showers',95:'Thunderstorm',99:'Hail Storm'};

async function fetchWeather(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=3.024&longitude=101.603&current_weather=true&hourly=relativehumidity_2m,apparent_temperature,windspeed_10m,uv_index&timezone=Asia%2FKuala_Lumpur&forecast_days=1');
    const d=await r.json();const cw=d.current_weather;const hr=new Date().getHours();
    document.getElementById('wx-icon').textContent=WI[cw.weathercode]||'🌡';
    document.getElementById('wx-temp').textContent=Math.round(cw.temperature)+'°';
    document.getElementById('wx-cond').textContent=WD[cw.weathercode]||'';
    document.getElementById('wx-hum').textContent=(d.hourly.relativehumidity_2m[hr]||'--')+'%';
    document.getElementById('wx-wind').textContent=Math.round(cw.windspeed)+' km/h';
    document.getElementById('wx-feel').textContent=Math.round(d.hourly.apparent_temperature[hr]||cw.temperature)+'°';
    document.getElementById('wx-uv').textContent=(d.hourly.uv_index?.[hr]??'--');
  }catch(e){document.getElementById('wx-cond').textContent='Unavailable';}
}
fetchWeather();setInterval(fetchWeather,5*60*1000);

// ── GPS SPEED ──
if(navigator.geolocation)
  navigator.geolocation.watchPosition(p=>{
    document.getElementById('spd-num').textContent=p.coords.speed!==null?Math.round(p.coords.speed*3.6):0;
  },()=>{},{enableHighAccuracy:true,maximumAge:1000});

// ── NAVIGATION ──
const PLACES=[
  {icon:'⛽',name:'Petrol',    q:'petrol station near Putra Heights Selangor'},
  {icon:'🍽',name:'Food',      q:'restaurant near Putra Heights Selangor'},
  {icon:'🛣',name:'R&R',       q:'rest area highway near Putra Heights Selangor'},
  {icon:'☕',name:'Café',      q:'cafe near Putra Heights Selangor'},
  {icon:'🕌',name:'Masjid',    q:'masjid near Putra Heights Selangor'},
  {icon:'🛐',name:'Surau',     q:'surau near Putra Heights Selangor'},
];

function wazeUrl(q){return 'waze://?q='+encodeURIComponent(q)+'&navigate=yes';}
function gmapsUrl(q){return 'https://maps.google.com/?q='+encodeURIComponent(q);}

function buildPlaces(){
  const grid=document.getElementById('places-grid');
  PLACES.forEach(p=>{
    const el=document.createElement('div');
    el.className='place-btn';
    el.innerHTML=`
      <div class="place-icon">${p.icon}</div>
      <div class="place-name">${p.name}</div>
      <div class="place-actions">
        <button class="pa-btn" data-q="${p.q}" data-app="waze">Waze</button>
        <button class="pa-btn" data-q="${p.q}" data-app="maps">Maps</button>
      </div>`;
    grid.appendChild(el);
  });
  grid.addEventListener('click',e=>{
    const btn=e.target.closest('.pa-btn');
    if(!btn)return;
    e.preventDefault();
    window.location.href=btn.dataset.app==='waze'?wazeUrl(btn.dataset.q):gmapsUrl(btn.dataset.q);
  });
}

function launchNav(app){
  const q=document.getElementById('dest').value.trim()||'Putra Heights Selangor';
  window.location.href=app==='waze'?wazeUrl(q):gmapsUrl(q);
}

document.getElementById('waze-btn').addEventListener('click',e=>{e.preventDefault();launchNav('waze');});
document.getElementById('gmaps-btn').addEventListener('click',e=>{e.preventDefault();launchNav('maps');});
document.getElementById('go-btn').addEventListener('click',()=>launchNav('maps'));
document.getElementById('dest').addEventListener('keydown',e=>{if(e.key==='Enter')launchNav('maps');});

buildStations();
buildPlaces();
</script>
</body>
