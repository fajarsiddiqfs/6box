<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CarPlayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:wght@300;400;600&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c0f;
    --bg2: #10141a;
    --bg3: #161c25;
    --accent: #00d4ff;
    --accent2: #0099cc;
    --amber: #ffb627;
    --green: #00e676;
    --red: #ff4444;
    --text: #e8edf3;
    --muted: #6b7a8d;
    --border: rgba(0,212,255,0.15);
    --glow: 0 0 20px rgba(0,212,255,0.2);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: 100%;
    height: 100vh;
    width: 100vw;
    gap: 0;
  }

  /* ─── LEFT PANEL ─── */
  #left {
    display: flex;
    flex-direction: column;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow: hidden;
    z-index: 10;
  }

  /* ─── WEATHER PANEL ─── */
  #weather-panel {
    padding: 20px 22px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
    flex-shrink: 0;
  }

  #clock-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }

  #clock {
    font-family: 'Rajdhani', monospace;
    font-size: 48px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    text-shadow: 0 0 30px rgba(0,212,255,0.5);
    line-height: 1;
  }

  #ampm {
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 1px;
  }

  #date-row {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  #weather-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #weather-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #weather-icon {
    font-size: 38px;
    line-height: 1;
    filter: drop-shadow(0 0 8px rgba(255,182,39,0.4));
  }

  #weather-temp {
    font-family: 'Rajdhani', sans-serif;
    font-size: 36px;
    font-weight: 600;
    color: var(--amber);
    line-height: 1;
  }

  #weather-desc {
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  #weather-details {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  #weather-details span { color: var(--text); font-weight: 400; }

  #weather-location {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  #weather-location::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ─── RADIO PANEL ─── */
  #radio-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 16px 0 8px;
  }

  #radio-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px 12px;
    border-bottom: 1px solid var(--border);
  }

  #radio-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }

  #vis-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 16px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  #vis-bars.active { opacity: 1; }

  .bar {
    width: 3px;
    background: var(--accent);
    border-radius: 1px;
    animation: bounce 0.8s ease-in-out infinite alternate;
    box-shadow: 0 0 4px var(--accent);
  }
  .bar:nth-child(1) { animation-delay: 0s; height: 8px; }
  .bar:nth-child(2) { animation-delay: 0.1s; height: 14px; }
  .bar:nth-child(3) { animation-delay: 0.2s; height: 6px; }
  .bar:nth-child(4) { animation-delay: 0.3s; height: 12px; }
  .bar:nth-child(5) { animation-delay: 0.15s; height: 10px; }

  @keyframes bounce {
    from { transform: scaleY(0.3); }
    to { transform: scaleY(1); }
  }

  #stations {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px;
    scrollbar-width: none;
  }
  #stations::-webkit-scrollbar { display: none; }

  .station {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    border: 1px solid transparent;
    margin-bottom: 4px;
    position: relative;
  }

  .station:hover { background: rgba(0,212,255,0.05); }

  .station.active {
    background: rgba(0,212,255,0.08);
    border-color: var(--border);
    box-shadow: inset 0 0 20px rgba(0,212,255,0.03);
  }

  .station-logo {
    width: 42px; height: 42px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    text-align: center;
    line-height: 1.2;
  }

  .station-info { flex: 1; min-width: 0; }

  .station-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.5px;
  }

  .station.active .station-name { color: var(--accent); }

  .station-genre {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .station-action {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s;
    padding: 0;
  }

  .station.active .station-action {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(0,212,255,0.4);
  }

  .station-action svg { width: 14px; height: 14px; }
  .station-action .play-icon { fill: var(--muted); }
  .station.active .station-action .play-icon { fill: var(--bg); }

  /* Now playing bar */
  #now-playing {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  #np-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  #np-station {
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }

  #volume-row svg { width: 14px; height: 14px; fill: var(--muted); flex-shrink: 0; }

  #vol-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    border-radius: 2px;
    background: var(--bg3);
    outline: none;
    cursor: pointer;
  }

  #vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(0,212,255,0.6);
    cursor: pointer;
  }

  /* ─── MAP PANEL ─── */
  #map-panel {
    position: relative;
    background: #0d1520;
    overflow: hidden;
  }

  #map-frame {
    width: 100%; height: 100%;
    border: none;
    display: block;
  }

  #map-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 5;
  }

  /* Top bar on map */
  #map-topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(10,12,15,0.95), transparent);
    pointer-events: auto;
    z-index: 10;
  }

  #map-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(0,212,255,0.4);
  }

  #speed-display {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  #speed-num {
    font-family: 'Rajdhani', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--amber);
    line-height: 1;
    text-shadow: 0 0 15px rgba(255,182,39,0.4);
  }

  #speed-unit {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Search bar */
  #map-search-wrapper {
    position: absolute;
    top: 60px;
    left: 12px;
    right: 12px;
    z-index: 10;
    pointer-events: auto;
  }

  #map-search {
    width: 100%;
    padding: 10px 16px;
    background: rgba(10,12,15,0.92);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    outline: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  #map-search::placeholder { color: var(--muted); }

  #map-search:focus { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(0,212,255,0.2); }

  /* Bottom gradient */
  #map-bottombar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: linear-gradient(to top, rgba(10,12,15,0.8), transparent);
    pointer-events: none;
  }

  /* Corner accent lines */
  .corner-tl, .corner-tr, .corner-bl, .corner-br {
    position: absolute;
    width: 20px; height: 20px;
    pointer-events: none;
    z-index: 20;
  }

  .corner-tl { top: 4px; left: 4px; border-top: 1.5px solid var(--accent); border-left: 1.5px solid var(--accent); }
  .corner-tr { top: 4px; right: 4px; border-top: 1.5px solid var(--accent); border-right: 1.5px solid var(--accent); }
  .corner-bl { bottom: 4px; left: 4px; border-bottom: 1.5px solid var(--accent); border-left: 1.5px solid var(--accent); }
  .corner-br { bottom: 4px; right: 4px; border-bottom: 1.5px solid var(--accent); border-right: 1.5px solid var(--accent); }

  /* Error message */
  #map-error {
    display: none;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
    padding: 20px;
  }

  #map-error p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    margin-top: 8px;
  }

  #map-error .map-icon {
    font-size: 40px;
    margin-bottom: 8px;
  }

  #open-maps-btn {
    margin-top: 14px;
    padding: 10px 22px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }

  #open-maps-btn:hover { background: rgba(0,212,255,0.1); }

  /* ─── AUDIO ELEMENT ─── */
  #audio-player { display: none; }

  /* Loading state */
  .loading-ring {
    display: none;
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    border: 2px solid rgba(0,212,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .station.loading .loading-ring { display: block; }
  .station.loading .station-action { display: none; }

  @keyframes spin {
    to { transform: translateY(-50%) rotate(360deg); }
  }

  /* Scanline overlay for HUD feel */
  #scanlines {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    z-index: 1000;
  }
</style>
</head>
<body>

<div id="scanlines"></div>

<div id="app">

  <!-- LEFT PANEL -->
  <div id="left">

    <!-- WEATHER -->
    <div id="weather-panel">
      <div id="clock-row">
        <div id="clock">00:00</div>
        <div id="ampm">AM</div>
      </div>
      <div id="date-row">Loading...</div>

      <div id="weather-body">
        <div id="weather-left">
          <div id="weather-icon">⛅</div>
          <div>
            <div id="weather-temp">--°C</div>
            <div id="weather-desc">Fetching...</div>
          </div>
        </div>
        <div id="weather-details">
          <div>Humidity <span id="w-humidity">--%</span></div>
          <div>Wind <span id="w-wind">-- km/h</span></div>
          <div>Feels <span id="w-feels">--°C</span></div>
        </div>
      </div>
      <div id="weather-location">Putra Heights, Selangor</div>
    </div>

    <!-- RADIO -->
    <div id="radio-panel">
      <div id="radio-header">
        <div id="radio-title">Radio Stations</div>
        <div id="vis-bars">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>

      <div id="stations"></div>

      <div id="now-playing">
        <div id="np-label">Now Playing</div>
        <div id="np-station">Select a station</div>
        <div id="volume-row">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="0.8">
        </div>
      </div>
    </div>

  </div>

  <!-- MAP PANEL -->
  <div id="map-panel">
    <div class="corner-tl"></div>
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
    <div class="corner-br"></div>

    <div id="map-topbar">
      <div id="map-title">CARPLAYER</div>
      <div id="speed-display">
        <div id="speed-num">0</div>
        <div id="speed-unit">km/h</div>
      </div>
    </div>

    <div id="map-search-wrapper">
      <input type="text" id="map-search" placeholder="Search destination…" id="map-search">
    </div>

    <iframe
      id="map-frame"
      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d31865!2d101.603!3d3.024!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2smy!4v1700000000000!5m2!1sen!2smy"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>

    <div id="map-bottombar"></div>
  </div>

</div>

<audio id="audio-player" preload="none"></audio>

<script>
const stations = [
  {
    name: "iRadio Malaysia",
    genre: "Top 40 / Pop",
    url: "https://stream.zeno.fm/fn3uu9peerruv",
    color: "#00d4ff",
    bg: "rgba(0,212,255,0.12)",
    abbr: "iR"
  },
  {
    name: "Hitz FM",
    genre: "Pop / Hits",
    url: "https://stream.zeno.fm/7yw0sjy1y0zuv",
    color: "#ff4d6d",
    bg: "rgba(255,77,109,0.12)",
    abbr: "HZ"
  },
  {
    name: "Fly FM",
    genre: "Pop / R&B",
    url: "https://stream.zeno.fm/sbcv00q7rcvuv",
    color: "#ffb627",
    bg: "rgba(255,182,39,0.12)",
    abbr: "FL"
  },
  {
    name: "ERA FM",
    genre: "Malay / Pop",
    url: "https://stream.zeno.fm/54ydnx2d0nfuv",
    color: "#69f0ae",
    bg: "rgba(105,240,174,0.12)",
    abbr: "ERA"
  },
  {
    name: "MY FM",
    genre: "Chinese Pop",
    url: "https://stream.zeno.fm/g5b6s4t3b6zuv",
    color: "#e040fb",
    bg: "rgba(224,64,251,0.12)",
    abbr: "MY"
  }
];

const audio = document.getElementById('audio-player');
const visBars = document.getElementById('vis-bars');
const npStation = document.getElementById('np-station');
const volSlider = document.getElementById('vol-slider');
let currentIdx = -1;
let isPlaying = false;

function buildStations() {
  const container = document.getElementById('stations');
  stations.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'station';
    el.dataset.idx = i;
    el.innerHTML = `
      <div class="station-logo" style="background:${s.bg};color:${s.color};border:1px solid ${s.color}33;">${s.abbr}</div>
      <div class="station-info">
        <div class="station-name">${s.name}</div>
        <div class="station-genre">${s.genre}</div>
      </div>
      <div class="loading-ring"></div>
      <button class="station-action" aria-label="Play ${s.name}">
        <svg viewBox="0 0 24 24"><path class="play-icon" d="M8 5v14l11-7z"/></svg>
      </button>`;
    el.addEventListener('click', () => toggleStation(i));
    container.appendChild(el);
  });
}

function toggleStation(idx) {
  const els = document.querySelectorAll('.station');

  if (currentIdx === idx && isPlaying) {
    audio.pause();
    isPlaying = false;
    els[idx].classList.remove('active');
    visBars.classList.remove('active');
    npStation.textContent = 'Paused';
    updatePlayIcon(idx, false);
    return;
  }

  if (currentIdx !== -1) {
    els[currentIdx].classList.remove('active', 'loading');
    updatePlayIcon(currentIdx, false);
  }

  currentIdx = idx;
  const s = stations[idx];
  els[idx].classList.add('loading');
  npStation.textContent = 'Connecting…';

  audio.src = s.url;
  audio.volume = parseFloat(volSlider.value);
  const playPromise = audio.play();

  if (playPromise !== undefined) {
    playPromise.then(() => {
      els[idx].classList.remove('loading');
      els[idx].classList.add('active');
      isPlaying = true;
      visBars.classList.add('active');
      npStation.textContent = s.name + ' — ' + s.genre;
      updatePlayIcon(idx, true);
    }).catch(() => {
      els[idx].classList.remove('loading');
      npStation.textContent = 'Stream unavailable';
      currentIdx = -1;
    });
  }
}

function updatePlayIcon(idx, playing) {
  const btn = document.querySelectorAll('.station')[idx].querySelector('.station-action');
  if (playing) {
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path class="play-icon" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
  } else {
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path class="play-icon" d="M8 5v14l11-7z"/></svg>`;
  }
}

volSlider.addEventListener('input', () => {
  audio.volume = parseFloat(volSlider.value);
});

audio.addEventListener('ended', () => {
  if (currentIdx !== -1) toggleStation(currentIdx);
});

// ─── CLOCK ───
function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clock').textContent = `${h}:${m}`;
  document.getElementById('ampm').textContent = ampm;

  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('date-row').textContent =
    `${days[now.getDay()]} · ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
}

setInterval(updateClock, 1000);
updateClock();

// ─── WEATHER ───
const weatherIcons = {
  0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
  45: '🌫️', 48: '🌫️',
  51: '🌦️', 53: '🌦️', 55: '🌧️',
  61: '🌧️', 63: '🌧️', 65: '🌧️',
  71: '❄️', 73: '❄️', 75: '❄️',
  80: '🌦️', 81: '🌧️', 82: '⛈️',
  95: '⛈️', 96: '⛈️', 99: '⛈️'
};

const weatherDesc = {
  0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
  45: 'Foggy', 48: 'Icy fog',
  51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle',
  61: 'Light rain', 63: 'Rain', 65: 'Heavy rain',
  71: 'Light snow', 73: 'Snow', 75: 'Heavy snow',
  80: 'Showers', 81: 'Heavy showers', 82: 'Violent showers',
  95: 'Thunderstorm', 96: 'Thunderstorm + hail', 99: 'Heavy thunderstorm'
};

async function fetchWeather() {
  try {
    const lat = 3.024, lon = 101.603;
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m,apparent_temperature,windspeed_10m&timezone=Asia%2FKuala_Lumpur&forecast_days=1`
    );
    const data = await res.json();
    const cw = data.current_weather;
    const code = cw.weathercode;
    const hour = new Date().getHours();

    document.getElementById('weather-icon').textContent = weatherIcons[code] || '🌡️';
    document.getElementById('weather-temp').textContent = Math.round(cw.temperature) + '°C';
    document.getElementById('weather-desc').textContent = weatherDesc[code] || 'Unknown';
    document.getElementById('w-humidity').textContent = (data.hourly.relativehumidity_2m[hour] || '--') + '%';
    document.getElementById('w-wind').textContent = Math.round(cw.windspeed) + ' km/h';
    document.getElementById('w-feels').textContent = Math.round(data.hourly.apparent_temperature[hour] || cw.temperature) + '°C';
  } catch (e) {
    document.getElementById('weather-desc').textContent = 'Unavailable';
  }
}

fetchWeather();
setInterval(fetchWeather, 5 * 60 * 1000);

// ─── SPEED (GPS) ───
if ('geolocation' in navigator) {
  const watchId = navigator.geolocation.watchPosition(
    pos => {
      const speed = pos.coords.speed;
      const kmh = speed !== null ? Math.round(speed * 3.6) : 0;
      document.getElementById('speed-num').textContent = kmh;
    },
    () => { document.getElementById('speed-num').textContent = '—'; },
    { enableHighAccuracy: true, maximumAge: 1000 }
  );
}

// ─── MAP SEARCH ───
document.getElementById('map-search').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const q = encodeURIComponent(this.value.trim());
    if (q) {
      const frame = document.getElementById('map-frame');
      frame.src = `https://maps.google.com/maps?q=${q}&output=embed&z=14`;
      this.blur();
    }
  }
});

buildStations();
</script>
</body>
</html>
