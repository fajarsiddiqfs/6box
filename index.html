<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>MyDash</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  color: #fff;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#app {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 4vw 6vw 4vw;
}

/* ─── ROW 1: BIG CLOCK ─── */
#row-time {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  text-align: center;
}

#time {
  font-size: clamp(6rem, 28vw, 22rem);
  font-weight: 900;
  letter-spacing: -8px;
  line-height: 0.88;
  color: #fff;
  width: 100%;
  text-align: center;
}

/* ─── ROW 2: Info strip (Day / Date / Weather / Location) ─── */
#row-info {
  display: flex;
  align-items: center;
  gap: 3vw;
  flex-shrink: 0;
  border-top: 1px solid rgba(255,255,255,0.1);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 1.8vh 0;
  flex-wrap: wrap;
}

/* Day + Date block */
#date-block {
  display: flex;
  align-items: baseline;
  gap: 1.2vw;
  flex-shrink: 0;
}

#day-name {
  font-size: clamp(0.8rem, 2vw, 1.8rem);
  font-weight: 800;
  color: rgba(255,255,255,0.38);
  text-transform: uppercase;
  letter-spacing: 3px;
}

#full-date {
  font-size: clamp(0.9rem, 2.2vw, 2rem);
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.5px;
}

/* Divider pip */
.info-sep {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  flex-shrink: 0;
}

/* Weather items */
.wx-item {
  display: flex;
  align-items: center;
  gap: 0.6vw;
}

.wx-item svg {
  width: clamp(16px, 2.2vw, 28px);
  height: clamp(16px, 2.2vw, 28px);
  color: rgba(255,255,255,0.4);
  flex-shrink: 0;
}

.wx-val {
  font-size: clamp(0.85rem, 2vw, 1.8rem);
  font-weight: 800;
  color: #fff;
}

.wx-lbl {
  font-size: clamp(0.55rem, 1.1vw, 0.95rem);
  font-weight: 700;
  color: rgba(255,255,255,0.3);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-left: 2px;
}

#info-spacer { flex: 1; }

#loc-item {
  display: flex;
  align-items: center;
  gap: 0.6vw;
}
#loc-item svg {
  width: clamp(14px, 1.8vw, 24px);
  height: clamp(14px, 1.8vw, 24px);
  color: rgba(255,255,255,0.3);
  flex-shrink: 0;
}
#loc-text {
  font-size: clamp(0.75rem, 1.6vw, 1.4rem);
  font-weight: 700;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.3px;
}

/* ─── ROW 3: Radio ─── */
#row-radio {
  display: flex;
  flex-direction: column;
  gap: 2vh;
  flex-shrink: 0;
}

/* Live badge */
#live-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: clamp(0.55rem, 1.1vw, 0.9rem);
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.28);
}
.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #fff;
  animation: blink 2s ease infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

/* Now-playing row: play btn LEFT + station info */
#now-playing {
  display: flex;
  align-items: center;
  gap: 2.5vw;
}

#play-btn {
  width: clamp(56px, 7.5vw, 96px);
  height: clamp(56px, 7.5vw, 96px);
  border-radius: 50%;
  border: none;
  background: #fff;
  color: #000;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
}
#play-btn:hover { background: rgba(255,255,255,0.85); }
#play-btn:active { transform: scale(0.94); }
#play-btn svg { width: 36%; height: 36%; }

#station-info {
  display: flex;
  flex-direction: column;
  gap: 0.3vh;
}

#station-name {
  font-size: clamp(1.6rem, 5.5vw, 5rem);
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1;
  color: #fff;
}

#station-sub {
  font-size: clamp(0.7rem, 1.5vw, 1.4rem);
  font-weight: 700;
  color: rgba(255,255,255,0.32);
}

#stream-status {
  font-size: clamp(0.65rem, 1.1vw, 1rem);
  font-weight: 600;
  color: rgba(255,255,255,0.22);
  letter-spacing: 1px;
  min-height: 1em;
  transition: color 0.3s;
}
#stream-status.on { color: rgba(255,255,255,0.6); }

/* Station toggle buttons */
#station-toggle {
  display: flex;
  gap: 1.2vw;
  flex-wrap: wrap;
}

.st-btn {
  display: flex;
  align-items: center;
  gap: 0.7vw;
  padding: clamp(8px,1.3vh,16px) clamp(14px,2vw,28px);
  border-radius: 50px;
  border: 2px solid rgba(255,255,255,0.14);
  background: transparent;
  color: rgba(255,255,255,0.38);
  font-family: 'Inter', sans-serif;
  font-size: clamp(0.72rem, 1.4vw, 1.2rem);
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.st-btn svg {
  width: clamp(14px, 1.8vw, 22px);
  height: clamp(14px, 1.8vw, 22px);
  flex-shrink: 0;
}
.st-btn:hover { color: #fff; border-color: rgba(255,255,255,0.38); }
.st-btn.active {
  background: #fff;
  border-color: #fff;
  color: #000;
}

/* Volume row */
#vol-row {
  display: flex;
  align-items: center;
  gap: 1.5vw;
  width: 100%;
}
#vol-row svg {
  width: clamp(16px, 2.2vw, 28px);
  height: clamp(16px, 2.2vw, 28px);
  color: rgba(255,255,255,0.28);
  flex-shrink: 0;
}
#vol-slider {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  background: rgba(255,255,255,0.14);
  border-radius: 2px;
  cursor: pointer;
  outline: none;
}
#vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: clamp(18px, 2.6vw, 30px);
  height: clamp(18px, 2.6vw, 30px);
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}
#vol-num {
  font-size: clamp(0.75rem, 1.2vw, 1.1rem);
  font-weight: 800;
  color: rgba(255,255,255,0.32);
  min-width: 3ch;
  text-align: right;
}

/* Fullscreen */
#fs-btn {
  position: fixed;
  bottom: 20px; right: 22px;
  width: clamp(40px, 5vw, 56px);
  height: clamp(40px, 5vw, 56px);
  border-radius: 14px;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(12px);
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 999;
  transition: border-color 0.2s;
}
#fs-btn:hover { border-color: rgba(255,255,255,0.45); }
#fs-btn svg { width: 44%; height: 44%; }
</style>
</head>
<body>

<div id="app">

  <!-- BIG CLOCK -->
  <div id="row-time">
    <div id="time">00:00</div>
  </div>

  <!-- INFO STRIP: Day · Date · Weather · Location -->
  <div id="row-info">
    <!-- Day + Date -->
    <div id="date-block">
      <div id="day-name">—</div>
      <div id="full-date">—</div>
    </div>

    <div class="info-sep"></div>

    <!-- Temp -->
    <div class="wx-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
      </svg>
      <div class="wx-val" id="wx-temp">—°</div>
      <div class="wx-lbl">Feels</div>
    </div>

    <div class="info-sep"></div>

    <!-- Weather desc -->
    <div class="wx-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
      </svg>
      <div class="wx-val" id="wx-desc">—</div>
    </div>

    <div class="info-sep"></div>

    <!-- Humidity -->
    <div class="wx-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
      </svg>
      <div class="wx-val" id="wx-hum">—</div>
      <div class="wx-lbl">Humidity</div>
    </div>

    <div class="info-sep"></div>

    <!-- Wind -->
    <div class="wx-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
      </svg>
      <div class="wx-val" id="wx-wind">—</div>
      <div class="wx-lbl">Wind</div>
    </div>

    <div id="info-spacer"></div>

    <!-- Location -->
    <div id="loc-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <div id="loc-text">Locating...</div>
    </div>
  </div>

  <!-- RADIO -->
  <div id="row-radio">

    <div id="live-badge"><span class="live-dot"></span> Live Radio</div>

    <!-- Play btn LEFT + station name RIGHT -->
    <div id="now-playing">
      <button id="play-btn" onclick="togglePlay()">
        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="6 3 20 12 6 21 6 3"/>
        </svg>
      </button>
      <div id="station-info">
        <div id="station-name">Quran Radio</div>
        <div id="station-sub">Tarateel · Live Stream</div>
        <div id="stream-status">Tap play to begin</div>
      </div>
    </div>

    <!-- Station selector -->
    <div id="station-toggle">
      <button class="st-btn active" id="btn-0" onclick="switchStation(0)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        Quran FM
      </button>
      <button class="st-btn" id="btn-1" onclick="switchStation(1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
        SomaFM
      </button>
      <button class="st-btn" id="btn-2" onclick="switchStation(2)">
        <!-- Lofi / headphones icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/>
          <path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
        </svg>
        Lofi Hip-Hop
      </button>
      <button class="st-btn" id="btn-3" onclick="switchStation(3)">
        <!-- Radio tower icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/>
          <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.4"/>
          <circle cx="12" cy="12" r="2"/>
          <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.4"/>
          <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/>
        </svg>
        Jazz Radio
      </button>
      <button class="st-btn" id="btn-4" onclick="switchStation(4)">
        <!-- Nature / ambient icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M12 22V12"/>
          <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
          <path d="M12 12a5 5 0 0 0 5-5c0-2-1-3.9-2.5-5C13.4 3.6 12 6 12 6s-1.4-2.4-2.5-4C8 3.1 7 5 7 7a5 5 0 0 0 5 5z"/>
        </svg>
        Nature FM
      </button>
    </div>

    <!-- Volume -->
    <div id="vol-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      </svg>
      <input type="range" id="vol-slider" min="0" max="100" value="85" oninput="setVol(this.value)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
      <div id="vol-num">85</div>
    </div>
  </div>

</div>

<!-- Fullscreen button -->
<button id="fs-btn" onclick="toggleFS()">
  <svg id="fs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
    <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
    <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
    <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
  </svg>
</button>

<audio id="aud" preload="none"></audio>

<script>
// ════════════════════
//  CLOCK
// ════════════════════
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function tick() {
  const n  = new Date();
  document.getElementById('time').textContent      = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  document.getElementById('day-name').textContent  = DAYS[n.getDay()].toUpperCase();
  document.getElementById('full-date').textContent = n.getDate() + ' ' + MONTHS[n.getMonth()] + ' ' + n.getFullYear();
}
tick();
setInterval(tick, 1000);

// ════════════════════
//  WEATHER
// ════════════════════
const WX_DESC = {
  0:'Clear',1:'Mostly Clear',2:'Partly Cloudy',3:'Overcast',
  45:'Foggy',48:'Icy Fog',
  51:'Drizzle',53:'Drizzle',55:'Drizzle',
  61:'Light Rain',63:'Rain',65:'Heavy Rain',
  71:'Light Snow',73:'Snow',75:'Heavy Snow',
  80:'Showers',81:'Showers',82:'Heavy Showers',
  95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'
};

async function fetchWeather(lat, lon) {
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=kmh&timezone=auto');
    const d = await r.json();
    const c = d.current;
    document.getElementById('wx-temp').textContent = Math.round(c.temperature_2m) + '°C';
    document.getElementById('wx-desc').textContent = WX_DESC[c.weather_code] || 'Unknown';
    document.getElementById('wx-hum').textContent  = c.relative_humidity_2m + '%';
    document.getElementById('wx-wind').textContent = Math.round(c.wind_speed_10m) + ' km/h';
  } catch(e) {
    document.getElementById('wx-desc').textContent = 'No data';
  }
}

async function fetchLocName(lat, lon) {
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json');
    const d = await r.json();
    const a = d.address;
    const parts = [a.suburb||a.village||a.town||a.city||a.county, a.state].filter(Boolean);
    document.getElementById('loc-text').textContent = parts.join(', ');
  } catch(e) {}
}

function initGeo() {
  if (!navigator.geolocation) {
    document.getElementById('loc-text').textContent = 'Selangor, MY';
    fetchWeather(2.9980, 101.5850);
    return;
  }
  navigator.geolocation.getCurrentPosition(function(p) {
    var lat = p.coords.latitude, lon = p.coords.longitude;
    fetchLocName(lat, lon);
    fetchWeather(lat, lon);
    setInterval(function(){ fetchWeather(lat, lon); }, 5*60*1000);
  }, function() {
    document.getElementById('loc-text').textContent = 'Putra Heights, Selangor';
    fetchWeather(2.9980, 101.5850);
  }, { timeout: 10000, enableHighAccuracy: true });
}

// ════════════════════
//  RADIO
// ════════════════════
var STATIONS = [
  { name:'Quran FM',      sub:'Tarateel · Live Stream',        url:'https://qurango.net/radio/tarateel' },
  { name:'SomaFM',        sub:'Drone Zone · Ambient',           url:'https://ice1.somafm.com/dronezone-128-mp3' },
  { name:'Lofi Hip-Hop',  sub:'Chillhop · 24/7 Beats',         url:'https://streams.fluxfm.de/Chillhop/mp3-320/audio/' },
  { name:'Jazz Radio',    sub:'Smooth Jazz · Live',             url:'https://streaming.radio.co/s3f6a75f88/listen' },
  { name:'Nature FM',     sub:'Ambient Sounds · Relaxation',    url:'https://ice4.somafm.com/deepspaceone-128-mp3' }
];

var stIdx = 0, isPlaying = false;
var aud   = document.getElementById('aud');

function setStatus(txt, live) {
  var el = document.getElementById('stream-status');
  el.textContent = txt;
  el.className   = live ? 'on' : '';
}

function updateUI() {
  var s = STATIONS[stIdx];
  document.getElementById('station-name').textContent = s.name;
  document.getElementById('station-sub').textContent  = s.sub;
  document.querySelectorAll('.st-btn').forEach(function(b, i){ b.classList.toggle('active', i===stIdx); });
}

function startStream() {
  setStatus('Connecting...', false);
  aud.src = STATIONS[stIdx].url;
  aud.volume = document.getElementById('vol-slider').value / 100;
  aud.load();
  aud.play().catch(function(){ setStatus('Could not connect', false); isPlaying=false; setPlayIcon(false); });
}

function setPlayIcon(p) {
  document.getElementById('play-icon').innerHTML = p
    ? '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'
    : '<polygon points="6 3 20 12 6 21 6 3"/>';
}

function togglePlay() {
  if (!isPlaying) { isPlaying=true; setPlayIcon(true); startStream(); }
  else            { isPlaying=false; aud.pause(); setPlayIcon(false); setStatus('Paused', false); }
}

function switchStation(i) {
  stIdx = i;
  updateUI();
  setStatus('Tap play to begin', false);
  if (isPlaying) startStream();
}

function setVol(v) {
  aud.volume = v/100;
  document.getElementById('vol-num').textContent = v;
}

aud.addEventListener('playing', function(){ setStatus('Playing Live', true); });
aud.addEventListener('waiting', function(){ setStatus('Buffering...', false); });
aud.addEventListener('error',   function(){ setStatus('Stream error', false); isPlaying=false; setPlayIcon(false); });
aud.addEventListener('stalled', function(){
  setStatus('Reconnecting...', false);
  setTimeout(function(){ if(isPlaying) startStream(); }, 3000);
});

// ════════════════════
//  FULLSCREEN
// ════════════════════
var FSE = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
var FSS = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';

function toggleFS() {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement);
    document.getElementById('fs-icon').innerHTML = FSS;
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    document.getElementById('fs-icon').innerHTML = FSE;
  }
}
document.addEventListener('fullscreenchange', function(){
  if (!document.fullscreenElement) document.getElementById('fs-icon').innerHTML = FSE;
});

// ════════════════════
//  INIT
// ════════════════════
initGeo();
updateUI();
</script>
</body>
</html>
