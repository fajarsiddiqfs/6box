<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #141414;
      font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 75% 60% at 10% 0%,   rgba(80,80,90,0.22) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 90% 100%, rgba(60,60,70,0.18) 0%, transparent 55%),
        radial-gradient(ellipse 50% 70% at 50% 50%,  rgba(40,40,48,0.12) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    #board {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 10px; padding: 10px;
      width: 100vw; height: 100vh;
    }

    .box {
      background: rgba(38,38,42,0.55);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      backdrop-filter: blur(28px) saturate(1.2) brightness(1.05);
      -webkit-backdrop-filter: blur(28px) saturate(1.2) brightness(1.05);
      overflow: hidden; position: relative;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .box:hover { background: rgba(50,50,56,0.65); border-color: rgba(255,255,255,0.13); }
    .box::after {
      content: '';
      position: absolute; top: 0; left: 16px; right: 16px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
      pointer-events: none; z-index: 20;
    }

    /* ── + button ── */
    .add-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: rgba(255,255,255,0.22);
      transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.18s;
    }
    .add-btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.22); color: rgba(255,255,255,0.6); transform: scale(1.1); }
    .add-btn:active { transform: scale(0.94); }
    .add-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; }

    /* ── iframe ── */
    .box iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; display: none; z-index: 1;
    }
    .box.loaded iframe { display: block; }

    /* ── blocked fallback ── */
    .blocked-msg {
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 24px;
      position: absolute; inset: 0; z-index: 2;
    }
    .box.blocked .blocked-msg { display: flex; }
    .box.blocked .add-btn { display: none; }

    .blocked-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.25);
    }
    .blocked-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .blocked-domain {
      font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.01em;
      max-width: 180px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .blocked-sub {
      font-size: 11px; color: rgba(255,255,255,0.22);
      line-height: 1.5; max-width: 200px;
    }

    .blocked-actions { display: flex; gap: 8px; margin-top: 2px; }

    .pill-btn {
      border-radius: 8px; font-size: 11px; font-weight: 500;
      padding: 7px 13px; cursor: pointer; font-family: inherit;
      letter-spacing: 0.02em;
      transition: background 0.14s, color 0.14s, border-color 0.14s, transform 0.12s;
      display: flex; align-items: center; gap: 5px;
    }
    .pill-btn:active { transform: scale(0.95); }
    .pill-btn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .pill-open {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.6);
    }
    .pill-open:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.24); color: rgba(255,255,255,0.9); }

    .pill-remove {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.28);
    }
    .pill-remove:hover { background: rgba(180,40,40,0.2); border-color: rgba(220,80,80,0.3); color: rgba(255,110,110,0.8); }

    /* ── overlay icon buttons ── */
    .icon-btn {
      position: absolute;
      width: 30px; height: 30px;
      background: rgba(22,22,26,0.72);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 9px;
      display: none; align-items: center; justify-content: center;
      cursor: pointer; color: rgba(255,255,255,0.3);
      z-index: 10;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: background 0.14s, color 0.14s, border-color 0.14s, transform 0.14s;
    }
    .box.loaded .icon-btn { display: flex; }
    .close-btn { top: 10px; left: 10px; display: none !important; }
    .box.loaded:hover .close-btn { display: flex !important; }
    .enlarge-btn { bottom: 10px; left: 10px; }
    .fs-btn      { bottom: 10px; right: 10px; }
    .icon-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn:hover { background: rgba(70,70,78,0.85); color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.18); transform: scale(1.08); }
    .icon-btn:active { transform: scale(0.93); }
    .close-btn:hover { background: rgba(160,40,40,0.3); border-color: rgba(220,80,80,0.35); color: rgba(255,110,110,0.85); }

    /* ── enlarged ── */
    .box.enlarged { position: fixed; inset: 10px; z-index: 4000; width: auto; height: auto; border-color: rgba(255,255,255,0.15); }

    /* ── fullscreen overlay ── */
    #overlay { display: none; position: fixed; inset: 0; z-index: 9000; background: #111; }
    #overlay.active { display: block; }
    #overlay iframe { width: 100%; height: 100%; border: none; }

    #exit-fs {
      position: fixed; top: 14px; right: 14px;
      width: 34px; height: 34px;
      background: rgba(22,22,26,0.8);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: rgba(255,255,255,0.38);
      z-index: 9001; backdrop-filter: blur(16px);
      transition: color 0.14s, background 0.14s, transform 0.14s;
    }
    #exit-fs:hover { color: rgba(255,255,255,0.82); background: rgba(70,70,78,0.85); transform: scale(1.06); }
    #exit-fs svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

    /* ── modal backdrop ── */
    #modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(10,10,12,0.6);
      backdrop-filter: blur(20px) saturate(1.1);
      -webkit-backdrop-filter: blur(20px) saturate(1.1);
      z-index: 8000; align-items: center; justify-content: center;
    }
    #modal-bg.open { display: flex; }

    #modal {
      background: rgba(36,36,40,0.82);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      padding: 26px 24px 20px;
      width: 420px; max-width: 90vw;
      backdrop-filter: blur(40px) saturate(1.3) brightness(1.08);
      -webkit-backdrop-filter: blur(40px) saturate(1.3) brightness(1.08);
      box-shadow: 0 2px 0 rgba(255,255,255,0.06) inset, 0 40px 80px rgba(0,0,0,0.55);
      animation: pop 0.22s cubic-bezier(0.34,1.4,0.64,1) both;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.93) translateY(12px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }

    .modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .modal-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.32);
    }
    .modal-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .modal-title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.42); letter-spacing: 0.02em; }

    .input-wrap {
      display: flex; align-items: center; gap: 10px;
      background: rgba(18,18,20,0.6);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px; padding: 0 14px; height: 44px;
      transition: border-color 0.15s, background 0.15s;
    }
    .input-wrap:focus-within { border-color: rgba(255,255,255,0.2); background: rgba(18,18,22,0.8); }
    .input-wrap svg { width: 13px; height: 13px; stroke: rgba(255,255,255,0.2); fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }
    #url-field {
      flex: 1; background: none; border: none; outline: none;
      color: rgba(255,255,255,0.68); font-size: 13px; font-family: inherit;
    }
    #url-field::placeholder { color: rgba(255,255,255,0.18); }

    .modal-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .btn {
      border-radius: 10px; font-size: 12px; font-weight: 500;
      padding: 9px 18px; cursor: pointer; font-family: inherit; letter-spacing: 0.02em;
      transition: background 0.14s, color 0.14s, border-color 0.14s, transform 0.12s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-cancel { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.28); }
    .btn-cancel:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.55); }
    .btn-ok { background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.16); color: rgba(255,255,255,0.72); }
    .btn-ok:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.26); color: rgba(255,255,255,0.95); }
  </style>
</head>
<body>

<div id="board"></div>

<div id="overlay">
  <div id="exit-fs" onclick="closeOverlay()" title="Exit fullscreen">
    <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
  </div>
  <iframe id="ov-frame" src="" title="Fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
</div>

<div id="modal-bg">
  <div id="modal">
    <div class="modal-header">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </div>
      <span class="modal-title">Paste a link</span>
    </div>
    <div class="input-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="url-field" type="url" placeholder="https://..." autocomplete="off" spellcheck="false"
        onkeydown="if(event.key==='Enter')confirm()">
    </div>
    <div class="modal-row">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-ok" onclick="confirm()">Embed</button>
    </div>
  </div>
</div>

<script>
  const board = document.getElementById('board');
  let activeIdx = null, enlargedIdx = null;
  const urls = {};

  for (let i = 0; i < 6; i++) {
    const box = document.createElement('div');
    box.className = 'box'; box.id = 'b' + i;
    box.innerHTML = `
      <button class="add-btn" onclick="openModal(${i})" aria-label="Add website">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>

      <iframe id="fr${i}" title="Panel ${i+1}"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>

      <div class="blocked-msg" id="bm${i}">
        <div class="blocked-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div>
          <div class="blocked-domain" id="bd${i}"></div>
          <div class="blocked-sub">This site blocks embedding.<br>Open it in a new tab instead.</div>
        </div>
        <div class="blocked-actions">
          <button class="pill-btn pill-open" onclick="openExternal(${i})">
            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Open
          </button>
          <button class="pill-btn pill-remove" onclick="clearBox(${i})">Remove</button>
        </div>
      </div>

      <div class="icon-btn close-btn" onclick="clearBox(${i})" title="Remove">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
      <div class="icon-btn enlarge-btn" id="en${i}" onclick="toggleEnlarge(${i})" title="Expand">
        <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </div>
      <div class="icon-btn fs-btn" onclick="openOverlay(${i})" title="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </div>`;
    board.appendChild(box);
  }

  function getDomain(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; }
  }

  function loadFrame(idx, url) {
    const box = document.getElementById('b' + idx);
    const fr  = document.getElementById('fr' + idx);
    urls[idx] = url;

    // reset state
    box.classList.remove('loaded', 'blocked');
    fr.src = '';

    // use a fresh iframe to detect load vs error
    const testFr = document.getElementById('fr' + idx);
    testFr.src = url;
    box.classList.add('loaded');

    // detect block: if the frame fires an error event, or if after load
    // the contentDocument is inaccessible and the frame is empty, show fallback
    testFr.onerror = () => showBlocked(idx);

    // Heuristic: after a short delay, check if cross-origin load appears empty
    // We can't read cross-origin contentDocument, so we rely on a load event
    // where the frame becomes 0-height or about:blank equivalent.
    // Instead: use the 'load' event — if the frame loaded but shows refusal,
    // the load still fires. We try accessing contentDocument; if cross-origin
    // it throws — that means it DID load (just cross-origin, likely fine).
    // If it's same-origin about:blank after a URL set = blocked.
    testFr.onload = () => {
      try {
        const doc = testFr.contentDocument;
        // accessible = same-origin; if it's about:blank, the site blocked us
        if (doc && (doc.URL === 'about:blank' || doc.URL === '')) {
          showBlocked(idx);
        }
        // if doc.URL is something else same-origin, it loaded fine
      } catch(e) {
        // cross-origin — frame loaded successfully, site allowed it
        // do nothing, keep loaded state
      }
    };
  }

  function showBlocked(idx) {
    const box = document.getElementById('b' + idx);
    const fr  = document.getElementById('fr' + idx);
    fr.src = '';
    box.classList.remove('loaded');
    box.classList.add('blocked');
    document.getElementById('bd' + idx).textContent = getDomain(urls[idx]);
  }

  function openExternal(idx) {
    if (urls[idx]) window.open(urls[idx], '_blank', 'noopener');
  }

  function toggleEnlarge(idx) {
    const box = document.getElementById('b' + idx);
    const btn = document.getElementById('en' + idx);
    if (enlargedIdx === idx) {
      box.classList.remove('enlarged');
      btn.querySelector('svg').innerHTML = '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>';
      btn.title = 'Expand'; enlargedIdx = null;
    } else {
      if (enlargedIdx !== null) {
        document.getElementById('b' + enlargedIdx).classList.remove('enlarged');
        const pb = document.getElementById('en' + enlargedIdx);
        pb.querySelector('svg').innerHTML = '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>';
        pb.title = 'Expand';
      }
      box.classList.add('enlarged');
      btn.querySelector('svg').innerHTML = '<path d="M8 3v5H3M21 8h-5V3M3 16h5v5M16 21v-5h5"/>';
      btn.title = 'Shrink'; enlargedIdx = idx;
    }
  }

  function openModal(idx) {
    activeIdx = idx;
    document.getElementById('url-field').value = '';
    document.getElementById('modal-bg').classList.add('open');
    setTimeout(() => document.getElementById('url-field').focus(), 60);
  }
  function closeModal() { document.getElementById('modal-bg').classList.remove('open'); activeIdx = null; }

  function confirm() {
    let url = document.getElementById('url-field').value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    loadFrame(activeIdx, url);
    closeModal();
  }

  function clearBox(idx) {
    const box = document.getElementById('b' + idx);
    document.getElementById('fr' + idx).src = '';
    box.classList.remove('loaded', 'blocked', 'enlarged');
    delete urls[idx];
    if (enlargedIdx === idx) enlargedIdx = null;
  }

  function openOverlay(idx) {
    if (!urls[idx]) return;
    document.getElementById('ov-frame').src = urls[idx];
    document.getElementById('overlay').classList.add('active');
  }
  function closeOverlay() {
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('ov-frame').src = '';
  }

  document.getElementById('modal-bg').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-bg')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.getElementById('overlay').classList.contains('active') ? closeOverlay() : closeModal();
  });
</script>
</body>
</html>
